[track_count]
args = None
sql = SELECT COUNT(*) AS track_count
      FROM tracks

[most_expensive_tracks]
args = None
sql = SELECT Name, UnitPrice
      FROM tracks
      ORDER BY UnitPrice DESC
      LIMIT 5

[genre_counts]
args = None
sql = SELECT genres.Name AS genre, COUNT(*) AS track_count
      FROM tracks
      JOIN genres ON tracks.GenreId = genres.GenreId
      GROUP BY genres.Name
      ORDER BY track_count DESC

[sales_support_agents]
args = None
sql = SELECT FirstName, LastName
      FROM employees
      WHERE Title = 'Sales Support Agent'

[best_selling_track]
args = None
sql = SELECT tracks.Name, COUNT(*) AS times_sold
      FROM invoice_items
      JOIN tracks ON invoice_items.TrackId = tracks.TrackId
      GROUP BY tracks.TrackId
      ORDER BY times_sold DESC
      LIMIT 1

[customers_in_country]
args = country
sql = SELECT FirstName, LastName, City
      FROM customers
      WHERE Country = :country

[tracks_longer_than]
args = seconds
sql = SELECT Name, Milliseconds
      FROM tracks
      WHERE Milliseconds > :seconds * 1000

[artist_albums]
args = artist
sql = SELECT albums.Title
      FROM albums
      JOIN artists ON albums.ArtistId = artists.ArtistId
      WHERE artists.Name = :artist

[country_invoices]
args = country
sql = SELECT invoices.InvoiceId, customers.FirstName || ' ' || customers.LastName AS customer, invoices.Total
      FROM invoices
      JOIN customers ON invoices.CustomerId = customers.CustomerId
      WHERE customers.Country = :country

[customer_total_spent]
args = customer_id
sql = SELECT customers.FirstName || ' ' || customers.LastName AS customer, SUM(invoices.Total) AS total_spent
      FROM customers
      JOIN invoices ON customers.CustomerId = invoices.CustomerId
      WHERE customers.CustomerId = :customer_id
