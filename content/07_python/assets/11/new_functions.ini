[artist_names]
args = None
sql = SELECT Name
      FROM artists

[cheap_tracks]
args = None
sql = SELECT Name, UnitPrice
      FROM tracks
      WHERE UnitPrice < 1

[employee_names]
args = None
sql = SELECT FirstName, LastName
      FROM employees
      ORDER BY LastName

[customers_no_company]
args = None
sql = SELECT FirstName, LastName
      FROM customers
      WHERE Company IS NULL

[customer_ids_by_last_name]
args = last_name
sql = SELECT CustomerId
      FROM customers
      WHERE LastName = :last_name

[artist_tracks]
args = artist
sql = SELECT tracks.Name
      FROM tracks
      JOIN albums ON tracks.AlbumId = albums.AlbumId
      JOIN artists ON albums.ArtistId = artists.ArtistId
      WHERE artists.Name = :artist

[customers_in_city]
args = city
sql = SELECT FirstName, LastName
      FROM customers
      WHERE City = :city

[albums_with_artists]
args = None
sql = SELECT albums.Title, artists.Name
      FROM albums
      JOIN artists ON albums.ArtistId = artists.ArtistId

[genre_track_count]
args = genre
sql = SELECT COUNT(*) AS track_count
      FROM tracks
      JOIN genres ON tracks.GenreId = genres.GenreId
      WHERE genres.Name = :genre

[country_average_invoice]
args = country
sql = SELECT AVG(Total) AS average_total
      FROM invoices
      WHERE BillingCountry = :country
